name: CI / CD

# ── Triggers ──────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ── Jobs ──────────────────────────────────────────────────────────────────────
jobs:

  # ── 1. Backend: lint → migrate → test ────────────────────────────────────
  backend-lint-test:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_USER: raguser
          POSTGRES_PASSWORD: ragpass
          POSTGRES_DB: financerag_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Used by Alembic (Phase 2) and pytest integration tests (Phase 6+)
      DATABASE_URL: postgresql://raguser:ragpass@localhost:5432/financerag_test
      # Real key only needed for generation tests; unit tests mock the OpenAI client.
      # Store as a GitHub Actions secret: Settings → Secrets → OPENAI_API_KEY_TEST
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY_TEST }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Lint — ruff
        working-directory: backend
        run: ruff check .

      # Phase 2 adds Alembic migrations; this step is a no-op until then
      # because there are no migration files yet. It will start doing real
      # work after the feature/db-schema branch is merged.
      - name: Run Alembic migrations
        working-directory: backend
        # Skip gracefully if alembic.ini doesn't exist yet (Phase 1 only)
        run: |
          if [ -f alembic.ini ]; then
            alembic upgrade head
          else
            echo "No alembic.ini found — skipping migrations (Phase 1)."
          fi

      - name: Run pytest
        working-directory: backend
        run: pytest -v

  # ── 2. Frontend: install → build ─────────────────────────────────────────
  frontend-build:
    name: Frontend — Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # Skip gracefully if frontend hasn't been scaffolded yet (Phase 7)
      - name: Install & build (if frontend exists)
        run: |
          if [ -f frontend/package.json ]; then
            cd frontend && npm ci && npm run build
          else
            echo "No frontend/package.json found — skipping (Phase 1)."
          fi

  # ── 3. Docker: build & publish backend image to GHCR ─────────────────────
  # Runs only on merges to main (not on PRs) to avoid publishing unreviewed code.
  publish-image:
    name: Publish Docker Image → GHCR
    needs: backend-lint-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write   # required to push to ghcr.io

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/finance-rag-backend
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
